apiVersion: v2
name: preview-app
description: |
  Ephemeral per-pull-request preview environment: FastAPI api + background worker
  + PostgreSQL, rendered once per open PR by an Argo CD ApplicationSet.
type: application

# version    — the chart's own version, bumped when templates change.
# appVersion — fallback image tag; CD always overrides it with image.tag=sha-<sha>.
version: 0.1.0
appVersion: "0.1.0"

home: https://github.com/alexmachulsky/preview-platform
sources:
  - https://github.com/alexmachulsky/preview-platform
keywords:
  - preview
  - ephemeral
  - pull-request
  - argocd
maintainers:
  - name: alexmachulsky
    url: https://github.com/alexmachulsky

# No dependencies on purpose.
#
# This chart used the Bitnami postgresql subchart until it was found to resolve
# to `bitnami/postgresql:latest` — Bitnami has withdrawn every version tag from
# docker.io/bitnami (only `latest` and signature tags remain; the 3948 versioned
# tags now live under `bitnamilegacy/`). An unpinnable database image means a
# preview re-synced next month can come up on a different major version, which
# is precisely the non-reproducibility this platform exists to prevent.
#
# The bundled Postgres is now a ~90-line StatefulSet on the pinned
# `postgres:16-alpine` — the same image docker-compose runs, so local and
# preview environments finally share one database build. It also drops an
# external chart fetch from every Argo CD sync.
