apiVersion: v2
name: preview-app
description: |
  Ephemeral per-pull-request preview environment: FastAPI api + background worker
  + PostgreSQL, rendered once per open PR by an Argo CD ApplicationSet.
type: application

# version    — the chart's own version, bumped when templates change.
# appVersion — fallback image tag; CD always overrides it with image.tag=sha-<sha>.
version: 0.1.0
appVersion: "0.1.0"

home: https://github.com/alexmachulsky/preview-platform
sources:
  - https://github.com/alexmachulsky/preview-platform
keywords:
  - preview
  - ephemeral
  - pull-request
  - argocd
maintainers:
  - name: alexmachulsky
    url: https://github.com/alexmachulsky

dependencies:
  # Bitnami prunes older chart versions from the index and Chart.lock is
  # git-ignored in this repo, so the constraint is a patch range rather than an
  # exact pin: `helm dependency update` must keep resolving months from now.
  - name: postgresql
    version: ~18.8.0
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
