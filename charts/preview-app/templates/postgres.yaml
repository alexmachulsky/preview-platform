{{- /*
Bundled PostgreSQL for a preview environment.

Deliberately first-party rather than the Bitnami subchart: see Chart.yaml for
why (every versioned bitnami/postgresql tag was withdrawn from Docker Hub, so
the subchart resolves to an unpinnable `:latest`). This runs the same
`postgres:16-alpine` image docker-compose uses, so a preview and a laptop
disagree about nothing.

Sync wave -5 puts the database ahead of the migration Job (wave 1) and the
application pods (wave 3) on the Argo CD path.
*/ -}}
{{- if .Values.postgresql.enabled }}
{{- $pg := .Values.postgresql }}
{{- $name := include "preview-app.postgresql.fullname" . }}
{{- $port := include "preview-app.postgresql.port" . | int }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "preview-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  annotations:
    {{- include "preview-app.annotations" (dict "ctx" $ "extra" (dict
        "argocd.argoproj.io/sync-wave" "-5")) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: {{ $port }}
      targetPort: postgresql
      protocol: TCP
  selector:
    {{- include "preview-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "preview-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  annotations:
    {{- include "preview-app.annotations" (dict "ctx" $ "extra" (dict
        "argocd.argoproj.io/sync-wave" "-5")) | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  revisionHistoryLimit: {{ $pg.revisionHistoryLimit | default 2 }}
  selector:
    matchLabels:
      {{- include "preview-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        {{- include "preview-app.labels" . | nindent 8 }}
        app.kubernetes.io/component: database
      # Rolls the pod whenever the derived credential changes. Without it a
      # changed database.passwordSeed rewrites the Secret while every pod keeps
      # running with the old value — and Postgres, initialised from the old
      # password, then rejects the api and worker. The rotation the seed
      # advertises only actually works because of this line.
      annotations:
        checksum/db-credentials: {{ include "preview-app.databaseUrl" . | sha256sum }}
        {{- with $pg.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "preview-app.imagePullSecrets" . | nindent 6 }}
      securityContext:
        # postgres:16-alpine runs as uid/gid 70 — the Alpine package's postgres
        # user, NOT the 999 the Debian-based tags use. fsGroup matters only when
        # persistence is on and a PVC has to be chowned.
        runAsUser: {{ $pg.securityContext.runAsUser }}
        runAsGroup: {{ $pg.securityContext.runAsGroup }}
        fsGroup: {{ $pg.securityContext.fsGroup }}
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: "{{ $pg.image.repository }}:{{ $pg.image.tag }}"
          imagePullPolicy: {{ $pg.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: postgresql
              containerPort: {{ $port }}
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: {{ $pg.auth.username | default "preview" | quote }}
            - name: POSTGRES_DB
              value: {{ $pg.auth.database | default "preview" | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "preview-app.dbSecretName" . }}
                  key: password
            # initdb refuses to run in a directory it does not own, and a PVC
            # arrives with a lost+found. A subdirectory keeps both paths working.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # pg_isready reports the server is accepting connections, which is
          # what the migration Job is actually waiting for.
          startupProbe:
            exec:
              command: [pg_isready, -U, {{ $pg.auth.username | default "preview" | quote }}, -d, {{ $pg.auth.database | default "preview" | quote }}]
            periodSeconds: 2
            failureThreshold: 45
          livenessProbe:
            exec:
              command: [pg_isready, -U, {{ $pg.auth.username | default "preview" | quote }}, -d, {{ $pg.auth.database | default "preview" | quote }}]
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            exec:
              command: [pg_isready, -U, {{ $pg.auth.username | default "preview" | quote }}, -d, {{ $pg.auth.database | default "preview" | quote }}]
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # readOnlyRootFilesystem: everything postgres writes outside its
            # data directory needs to be a volume — the unix socket and scratch.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if not $pg.persistence.enabled }}
        # A preview is thrown away with its pull request; a PVC left behind is
        # exactly the garbage this platform exists to prevent.
        - name: data
          emptyDir:
            sizeLimit: {{ $pg.persistence.size | default "1Gi" }}
        {{- end }}
      {{- with $pg.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $pg.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "preview-app.labels" . | nindent 10 }}
          app.kubernetes.io/component: database
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $pg.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.persistence.size }}
  {{- end }}
{{- end }}
