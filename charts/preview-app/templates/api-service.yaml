apiVersion: v1
kind: Service
metadata:
  name: {{ include "preview-app.api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "preview-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    {{- include "preview-app.annotations" (dict "ctx" $ "extra" (merge (dict
        "argocd.argoproj.io/sync-wave" "0") (.Values.api.service.annotations | default dict))) | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    # Application traffic and the probes. This is the port the Ingress binds,
    # so everything served here is public at the preview URL.
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
    # Scraped by the ServiceMonitor. Deliberately a second port so /metrics is
    # not reachable through the Ingress.
    - name: metrics
      port: {{ .Values.api.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "preview-app.api.selectorLabels" . | nindent 4 }}
