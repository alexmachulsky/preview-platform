{{- /*
Database credentials.

`password` is generated once and then reused on every upgrade (see the
preview-app.dbPassword helper); the postgresql subchart reads its credentials
from this same Secret via auth.existingSecret, so the value the database was
initialised with and the value the application connects with can never drift.

It is annotated as a Helm hook at weight -10 so that it exists before the
pre-install migration hook runs, and as an Argo CD Sync hook in the earliest
wave for the same reason on the GitOps path.
*/ -}}
{{- if include "preview-app.createDbSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "preview-app.dbSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "preview-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  annotations:
    {{- include "preview-app.annotations" (dict "ctx" $ "extra" (dict
        "helm.sh/hook" "pre-install,pre-upgrade"
        "helm.sh/hook-weight" "-10"
        "helm.sh/hook-delete-policy" "before-hook-creation"
        "argocd.argoproj.io/hook" "Sync"
        "argocd.argoproj.io/hook-delete-policy" "BeforeHookCreation"
        "argocd.argoproj.io/sync-wave" "-10")) | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  # Consumed by the bundled Postgres StatefulSet as POSTGRES_PASSWORD. The
  # official image makes POSTGRES_USER a superuser, so there is no separate
  # admin credential to carry.
  password: {{ include "preview-app.dbPassword" . | quote }}
  {{- end }}
  # Consumed by api, worker, migrate and seed.
  {{ .Values.database.urlKey }}: {{ include "preview-app.databaseUrl" . | quote }}
{{- end }}
