{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "preview-app.worker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "preview-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  annotations:
    {{- include "preview-app.annotations" (dict "ctx" $ "extra" (dict
        "argocd.argoproj.io/sync-wave" "3")) | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  revisionHistoryLimit: {{ .Values.worker.revisionHistoryLimit }}
  strategy:
    # The worker holds a database poll loop; two of them briefly overlapping is
    # harmless, but there is nothing to gain from a surge either.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      {{- include "preview-app.worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "preview-app.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      # Rolls the pod whenever the derived credential changes. Without it a
      # changed database.passwordSeed rewrites the Secret while every pod keeps
      # running with the old value — and Postgres, initialised from the old
      # password, then rejects the api and worker. The rotation the seed
      # advertises only actually works because of this line.
      annotations:
        checksum/db-credentials: {{ include "preview-app.databaseUrl" . | sha256sum }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.image.pullSecrets }}
      {{- include "preview-app.imagePullSecrets" . | nindent 6 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "preview-app.podSecurityContext" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "preview-app.worker.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "preview-app.containerSecurityContext" . | nindent 12 }}
          ports:
            # No service traffic — this port is health + metrics only.
            - name: metrics
              containerPort: {{ .Values.worker.metricsPort }}
              protocol: TCP
          env:
            {{- include "preview-app.commonEnv" . | nindent 12 }}
            - name: POLL_INTERVAL_SECONDS
              value: {{ .Values.worker.pollIntervalSeconds | quote }}
          startupProbe:
            httpGet:
              path: {{ .Values.worker.probes.startup.path }}
              port: metrics
            periodSeconds: {{ .Values.worker.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.worker.probes.startup.failureThreshold }}
            timeoutSeconds: {{ .Values.worker.probes.startup.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.worker.probes.liveness.path }}
              port: metrics
            periodSeconds: {{ .Values.worker.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.worker.probes.liveness.failureThreshold }}
            timeoutSeconds: {{ .Values.worker.probes.liveness.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.worker.probes.readiness.path }}
              port: metrics
            periodSeconds: {{ .Values.worker.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.worker.probes.readiness.failureThreshold }}
            timeoutSeconds: {{ .Values.worker.probes.readiness.timeoutSeconds }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
