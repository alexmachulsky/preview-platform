name: preview-lifecycle

# Which pull requests deserve an environment, and for how long.
#
# The `preview` label is the switch. Argo CD's pullRequest generator only lists
# PRs carrying it, so adding the label creates an environment and removing it
# destroys one — through exactly the same reconcile path a closed PR takes.
# Nothing here talks to the cluster, and no job deletes a namespace.
#
#   opened / reopened  → add the label      → environment appears
#   idle for N days    → remove the label   → environment disappears
#   comment "/preview" → add it back        → environment returns
#
# The alternative was a CronJob in-cluster that deletes stale namespaces. It
# would have lost: Argo CD's selfHeal recreates anything deleted behind its
# back, so the reaper and the controller would fight every three minutes.
# Withdrawing the PR from the generator's result set is the only way to remove
# a preview that the platform's own controller agrees with.

# Only the `pull_request` trigger runs the version of this file on the PR
# branch. GitHub takes `issue_comment`, `schedule` and `workflow_dispatch` from
# the default branch, so changes to those three jobs cannot be tested on a
# branch — they take effect on merge.
on:
  pull_request:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  schedule:
    # Off the hour: GitHub queues scheduled workflows and drops them under load
    # at popular times.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be reaped without changing anything"
        type: boolean
        default: false

permissions:
  contents: read

env:
  PREVIEW_LABEL: preview
  # Days without activity before a preview is reclaimed. Any push, comment or
  # review bumps a PR's updated_at, so this measures abandonment rather than
  # age — a PR under review for two weeks keeps its environment.
  STALE_AFTER_DAYS: "3"

jobs:
  # ── Give new pull requests an environment ──────────────────────────────────
  label:
    # Fork PRs get a read-only token, so the label could not be applied anyway.
    # That is the desired outcome rather than a limitation worked around: a
    # preview built from a fork would run unreviewed code inside the cluster,
    # against a namespace that can reach the platform's own services. Previews
    # for forks need a maintainer to add the label by hand, which is a review.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Add the preview label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Adding a label the repository has never seen fails, so a fresh fork
          # of this repo would break on its first pull request.
          #
          # REST rather than `gh label`, which only exists from gh 2.10. Every
          # call in this workflow is a plain API call for that reason: the
          # runner's gh version is not something this repo controls, and a
          # workflow that silently depends on it breaks on someone else's
          # machine, not here.
          # Captured first rather than piped straight into grep. `grep -q` exits
          # on the first match, which SIGPIPEs the still-writing `gh --paginate`;
          # under `set -o pipefail` the pipeline then reports failure exactly
          # when the label *is* present, the create call 422s, and set -e takes
          # the job down. It needs enough labels to overflow the 64KB pipe
          # buffer before grep quits, so a small repository would never see it —
          # which is the argument for spending one variable on it rather than
          # leaving a failure that appears only on somebody else's repo.
          EXISTING=$(gh api "repos/${REPO}/labels" --paginate --jq '.[].name')

          if ! grep -qxF "$PREVIEW_LABEL" <<< "$EXISTING"; then
            gh api -X POST "repos/${REPO}/labels" \
              -f "name=$PREVIEW_LABEL" \
              -f color=0E8A16 \
              -f description="Argo CD keeps an ephemeral environment for this PR" \
              --jq '.name + " label created"'
          fi

          # REST, not `gh pr edit --add-label`. That command resolves the PR
          # through GraphQL and asks for projectCards along the way, a field
          # Projects (classic) deprecated — so on older gh it fails outright
          # with a deprecation error and never reaches the label. This endpoint
          # has no such dependency and behaves the same on every gh version.
          printf '{"labels":["%s"]}' "$PREVIEW_LABEL" \
            | gh api -X POST "repos/${REPO}/issues/${PR}/labels" \
                --input - --jq '[.[].name] | join(", ")'
          echo "Labelled PR #$PR — Argo CD will pick it up on its next poll"

  # ── Bring a reaped preview back ────────────────────────────────────────────
  revive:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/preview')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Restore the preview label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          # Only people who could merge the PR may spend cluster capacity on
          # it. github.event.comment.body is never interpolated into the shell.
          AUTHOR_ROLE: ${{ github.event.comment.author_association }}
        run: |
          set -euo pipefail

          case "$AUTHOR_ROLE" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *)
              echo "::notice::/preview from a $AUTHOR_ROLE is ignored"
              exit 0
              ;;
          esac

          printf '{"labels":["%s"]}' "$PREVIEW_LABEL" \
            | gh api -X POST "repos/${REPO}/issues/${PR}/labels" \
                --input - --jq '[.[].name] | join(", ")'
          echo "Restored the preview for PR #$PR"

  # ── Reclaim environments nobody is using ───────────────────────────────────
  reap:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Remove the label from idle pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          CUTOFF=$(date -u -d "$STALE_AFTER_DAYS days ago" +%s)
          echo "Reaping previews idle since $(date -u -d "@$CUTOFF" --iso-8601=seconds)"

          # Read the whole list before looping. A `gh ... | while read` pipeline
          # runs the loop body in a subshell, so the counters below would be
          # discarded the moment the pipeline ends.
          OPEN=$(gh pr list --repo "$REPO" --state open \
                   --label "$PREVIEW_LABEL" --limit 200 \
                   --json number,updatedAt \
                   --jq '.[] | [.number, .updatedAt] | @tsv')

          if [ -z "$OPEN" ]; then
            echo "No labelled pull requests are open — nothing to do."
            exit 0
          fi

          REAPED=0
          KEPT=0

          while IFS=$'\t' read -r NUMBER UPDATED_AT; do
            [ -n "$NUMBER" ] || continue
            UPDATED=$(date -u -d "$UPDATED_AT" +%s)
            IDLE_DAYS=$(( ( $(date -u +%s) - UPDATED ) / 86400 ))

            if [ "$UPDATED" -ge "$CUTOFF" ]; then
              echo "  #$NUMBER  keep   (idle ${IDLE_DAYS}d)"
              KEPT=$(( KEPT + 1 ))
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "  #$NUMBER  REAP   (idle ${IDLE_DAYS}d) — dry run, not touched"
              REAPED=$(( REAPED + 1 ))
              continue
            fi

            echo "  #$NUMBER  reap   (idle ${IDLE_DAYS}d)"

            # Built with printf rather than a heredoc: this is nested two levels
            # inside a YAML block scalar, and a heredoc terminator has to sit in
            # column 0 after YAML strips the block indentation.
            BODY=$(printf '%s\n' \
              "### Preview environment reclaimed" \
              "" \
              "No activity for ${IDLE_DAYS} days, so the \`${PREVIEW_LABEL}\` label was removed" \
              "and Argo CD has torn the environment down. Nothing about this pull request" \
              "changed — the branch, the commits and the review are untouched." \
              "" \
              "Comment \`/preview\` to bring it back.")

            # Comment before unlabelling. If the label went first and the comment
            # then failed, the environment would vanish with no explanation on
            # the PR. The comment also bumps updated_at, so doing it second would
            # make an already-reaped PR look active on the next run.
            gh api -X POST "repos/${REPO}/issues/${NUMBER}/comments" \
              -f body="$BODY" --jq '.html_url'
            gh api -X DELETE "repos/${REPO}/issues/${NUMBER}/labels/${PREVIEW_LABEL}" \
              --jq '[.[].name] | join(", ") | "remaining labels: " + .'
            REAPED=$(( REAPED + 1 ))
          done <<< "$OPEN"

          echo "Kept $KEPT, reaped $REAPED."
          {
            echo "### Preview reaper"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Idle threshold | ${STALE_AFTER_DAYS}d |"
            echo "| Kept | $KEPT |"
            echo "| Reaped | $REAPED |"
          } >> "$GITHUB_STEP_SUMMARY"
