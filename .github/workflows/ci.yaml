name: ci

# A preview environment is only as fresh as the image CI pushed for the PR's
# head commit, so every push to a PR branch has to rebuild.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# A second push to the same PR makes the first build irrelevant.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # ── Lint and test both services against a real Postgres ────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: preview
          POSTGRES_PASSWORD: preview
          POSTGRES_DB: preview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U preview"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ${{ matrix.service }}
        run: pip install --disable-pip-version-check -e "apps/${{ matrix.service }}[dev]" ruff

      # ruff.toml lives at the repository root, so ruff runs from there.
      - name: Lint
        run: |
          ruff check apps/${{ matrix.service }}
          ruff format --check apps/${{ matrix.service }}

      - name: Test
        working-directory: apps/${{ matrix.service }}
        env:
          # The suite creates and owns preview_test. Pointing it at the
          # application's own database leaves the schema present but unstamped,
          # and the next `alembic upgrade head` dies with DuplicateTable.
          TEST_DATABASE_URL: postgresql+psycopg://preview:preview@localhost:5432/preview_test
        run: pytest -q

  # ── Build and publish images ───────────────────────────────────────────────
  build:
    needs: test
    # A fork PR gets a read-only GITHUB_TOKEN and no OIDC identity, so pushing
    # and signing cannot work. Skipping is honest; letting it run produces a
    # credential error that reads like a broken pipeline instead of a policy.
    # Fork PRs get no preview either (see preview-lifecycle.yaml), so nothing
    # downstream depends on an image existing here.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign exchanges this for a short-lived Sigstore
      # certificate. No private key exists to store or leak.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker]

    steps:
      - uses: actions/checkout@v7

      - name: Resolve the commit Argo CD will ask for
        id: sha
        env:
          # Passed through env rather than inlined into the script: workflow
          # expressions are substituted textually before bash ever sees them.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # On a pull_request event GITHUB_SHA is the *merge* commit Actions
          # synthesised, which exists nowhere in the PR's history. Argo CD's
          # pullRequest generator reports head_sha — the branch tip. Tagging
          # with GITHUB_SHA would publish an image no preview ever requests,
          # leaving the environment in ImagePullBackOff with no obvious cause.
          SHA="${HEAD_SHA:-$PUSH_SHA}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Tagging for commit $SHA"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Scan before publishing, not after ────────────────────────────────
      # Deliberately built into the local daemon first. Scanning a pushed image
      # is easier, but by then the tag exists — and Argo CD's only criterion
      # for deploying a preview is that the tag resolves. A red pipeline would
      # not stop it. Nothing vulnerable should reach the registry at all.
      #
      # The push below re-runs the same build; every layer is a cache hit, so
      # it costs seconds rather than a second build.
      - name: Build ${{ matrix.service }} for scanning
        uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.service }}
          load: true
          push: false
          tags: preview-platform/${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false

      # --ignore-unfixed on purpose. A base-image CVE with no released fix is
      # not actionable here, and a gate that fails on those trains everyone to
      # ignore it. This fails only on things that can actually be fixed today.
      - name: Fail on fixable HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: preview-platform/${{ matrix.service }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Generate an SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: preview-platform/${{ matrix.service }}:scan
          scan-type: image
          format: spdx-json
          output: sbom.spdx.json
          # Reporting, not gating — the gate above already ran.
          exit-code: "0"

      - name: Push ${{ matrix.service }}
        id: push
        uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.service }}
          push: true
          # sha-<full> is the tag the ApplicationSet resolves. The others are
          # for humans reading `docker images`.
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:sha-${{ steps.sha.outputs.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false

      # cosign is pinned to the 2.x line, and that is a compatibility decision
      # rather than conservatism.
      #
      # cosign v3 stores signatures as OCI 1.1 referrers carrying the new
      # Sigstore bundle (artifactType https://sigstore.dev/cosign/sign/v1).
      # Kyverno 1.18 cannot read that in either mode: its default lookup wants
      # the legacy `sha256-<digest>.sig` tag, and its `cosignOCI11` option
      # expects cosign v2's older referrer artifact type. Both were tried
      # against real images and both reported "no signatures found" for a
      # signature that `cosign verify` accepts.
      #
      # v2.6.5 writes the legacy tag, which is what the admission policy reads.
      # Revisit when Kyverno understands the v3 bundle format.
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v2.6.5

      - name: Record the cosign version actually in use
        run: cosign version --json | python3 -c "import sys,json;print('cosign', json.load(sys.stdin)['gitVersion'])"

      # Everything below addresses the digest, never a tag. A tag is a mutable
      # pointer: signing one says "whatever this name resolves to right now is
      # fine", which is exactly the claim an attacker wants to be able to move.
      - name: Sign the image and attest its SBOM
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail

          # No flag controls the storage layout: --registry-referrers-mode only
          # affects *fetching*, despite reading like a write option. Which
          # layout gets written is a property of the cosign major version, which
          # is why it is pinned above.
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type spdxjson \
            --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"
          echo "Signed ${IMAGE}@${DIGEST}"

      # A signing step that silently produced nothing verifiable would be worse
      # than no signing at all, because the badge would still be there.
      - name: Verify the signature we just made
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          DIGEST: ${{ steps.push.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${REPO}/.github/workflows/ci.yaml@" \
            "${IMAGE}@${DIGEST}" > /dev/null
          echo "Signature verifies for ${IMAGE}@${DIGEST}"

  # ── Tell the reviewer where to look ────────────────────────────────────────
  comment:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Post or update the preview comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          MARKER="<!-- preview-platform-comment -->"
          SHORT="${HEAD_SHA:0:7}"

          BODY=$(cat <<EOF
          $MARKER
          ### Preview environment

          | | |
          |---|---|
          | **URL** | http://pr-${PR}.localtest.me:8080/ |
          | **Grafana** | http://grafana.localtest.me:8080/d/preview-app?var-namespace=preview-pr-${PR} |
          | **Namespace** | \`preview-pr-${PR}\` |
          | **Commit** | \`${SHORT}\` |

          Argo CD reconciles once it next polls GitHub — 30s with a token
          configured, 120s without. If the URL 404s, the sync has not landed
          yet:

          \`\`\`
          kubectl -n preview-pr-${PR} get pods
          kubectl -n argocd get application preview-pr-${PR}
          \`\`\`

          <sub>The cluster is local, so these URLs resolve only on the machine
          running it — \`*.localtest.me\` points at 127.0.0.1. Closing this PR
          deletes the environment, and so does three days without activity —
          comment \`/preview\` to bring it back.</sub>
          EOF
          )

          # Update in place rather than stacking a new comment on every push.
          ID=$(gh api "repos/${REPO}/issues/${PR}/comments" \
                 --jq "[.[] | select(.body | startswith(\"$MARKER\"))][0].id // empty")

          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${ID}" -f body="$BODY" >/dev/null
            echo "Updated comment $ID"
          else
            gh api -X POST "repos/${REPO}/issues/${PR}/comments" -f body="$BODY" >/dev/null
            echo "Created preview comment"
          fi
