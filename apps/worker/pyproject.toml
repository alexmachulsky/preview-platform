[project]
name = "preview-worker"
version = "0.1.0"
description = "Preview Platform demo worker — drains the jobs queue written by the api"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy~=2.0.35",
    "psycopg[binary]~=3.2.3",
    "prometheus-client~=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
