[project]
name = "preview-api"
version = "0.1.0"
description = "Preview Platform demo API — FastAPI service backing the ephemeral PR environments"
requires-python = ">=3.10"
dependencies = [
    "fastapi~=0.141.0",
    "uvicorn[standard]~=0.32.0",
    "sqlalchemy~=2.0.35",
    "psycopg[binary]~=3.2.3",
    "alembic~=1.14.0",
    "pydantic~=2.9.0",
    "pydantic-settings~=2.6.0",
    "jinja2~=3.1.4",
    "prometheus-fastapi-instrumentator~=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3.0",
    "httpx~=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
