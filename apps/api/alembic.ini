; Alembic configuration for the Preview Platform api service.
; Migrations run from the api image with WORKDIR /app:  alembic upgrade head
;
; The database URL is not stored here — env.py reads DATABASE_URL from the
; environment so the same image works in every preview namespace.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

; Logging is configured in env.py (JSON, same format as the services), so the
; usual [loggers]/[handlers]/[formatters] sections are intentionally absent.
