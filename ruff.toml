# Shared lint/format configuration for the Python workloads in apps/.
# The container images run Python 3.12, but the local development venv is
# 3.10 — the source must stay compatible with the lower bound.
target-version = "py310"
line-length = 100
src = ["apps/api", "apps/worker"]

exclude = [
    ".venv",
    "venv",
    "__pycache__",
    "apps/api/alembic/versions",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "B008", # FastAPI dependency injection relies on calls in argument defaults
]

[lint.per-file-ignores]
"**/tests/*" = ["E501"]

[lint.isort]
known-first-party = ["app", "worker"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
